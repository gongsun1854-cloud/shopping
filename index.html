<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #8b93a7;
    --primary: #4f6ef7;
    --primary-dark: #3b57d8;
    --done: #b3bccf;
    --border: #e6e9f2;
    --danger: #ef5b63;
    --shadow: 0 10px 30px rgba(31, 36, 48, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141824;
      --card: #1e2433;
      --text: #eef1f7;
      --muted: #8891a6;
      --primary: #6d8bff;
      --primary-dark: #566ee0;
      --done: #545d73;
      --border: #2b3346;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .app {
    width: 100%;
    max-width: 520px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 26px;
    letter-spacing: -0.5px;
  }
  header p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
  }
  .card {
    background: var(--card);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .input-row {
    display: flex;
    gap: 8px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .input-row input {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: border-color .15s;
  }
  .input-row input:focus { border-color: var(--primary); }
  .input-row button {
    border: none;
    background: var(--primary);
    color: #fff;
    padding: 0 18px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .input-row button:hover { background: var(--primary-dark); }

  ul { list-style: none; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    animation: fade .2s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }
  li:last-child { border-bottom: none; }
  .check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--muted);
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
  }
  li.done .check {
    background: var(--primary);
    border-color: var(--primary);
  }
  .check svg { opacity: 0; }
  li.done .check svg { opacity: 1; }
  .name {
    flex: 1;
    font-size: 16px;
    word-break: break-all;
  }
  li.done .name {
    color: var(--done);
    text-decoration: line-through;
  }
  .qty {
    font-size: 13px;
    color: var(--muted);
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 8px;
  }
  .del {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    padding: 4px 6px;
    border-radius: 8px;
    transition: color .15s, background .15s;
  }
  .del:hover { color: var(--danger); background: rgba(239,91,99,.1); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-size: 15px;
  }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    font-size: 14px;
    color: var(--muted);
  }
  footer button {
    border: none;
    background: transparent;
    color: var(--danger);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  footer button:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🛒 쇼핑 리스트</h1>
      <p>살 것을 추가하고, 다 사면 눌러서 체크하세요</p>
    </header>

    <div class="card">
      <div class="input-row">
        <input type="text" id="itemInput" placeholder="예: 우유" maxlength="40" autocomplete="off">
        <input type="text" id="qtyInput" placeholder="수량" maxlength="10" style="flex:0 0 72px;">
        <button id="addBtn">추가</button>
      </div>
      <ul id="list"></ul>
      <div class="empty" id="empty">아직 담은 품목이 없어요.</div>
      <footer id="footer" style="display:none;">
        <span id="counter"></span>
        <button id="clearBtn">완료 항목 비우기</button>
      </footer>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Supabase 연동 설정 (혼공바이브 프로젝트)
  const SUPABASE_URL = 'https://hodcdxkgfqtgysgsqfnb.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_BqDQ7kA7-oN3YiWUR4bJ9w_V6rOTGHO';
  const TABLE = 'shopping_items';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const itemInput = document.getElementById('itemInput');
  const qtyInput  = document.getElementById('qtyInput');
  const addBtn    = document.getElementById('addBtn');
  const listEl    = document.getElementById('list');
  const emptyEl   = document.getElementById('empty');
  const footerEl  = document.getElementById('footer');
  const counterEl = document.getElementById('counter');
  const clearBtn  = document.getElementById('clearBtn');

  let items = [];

  // Supabase에서 전체 목록을 불러와 화면에 반영
  async function load() {
    const { data, error } = await db
      .from(TABLE)
      .select('*')
      .order('created_at', { ascending: true });
    if (error) {
      console.error('목록 불러오기 실패:', error);
      emptyEl.textContent = '데이터를 불러오지 못했어요.';
      emptyEl.style.display = 'block';
      return;
    }
    items = data || [];
    render();
  }

  async function addItem() {
    const name = itemInput.value.trim();
    if (!name) { itemInput.focus(); return; }
    const qty = qtyInput.value.trim();
    itemInput.value = '';
    qtyInput.value = '';
    itemInput.focus();

    const { data, error } = await db
      .from(TABLE)
      .insert({ name, qty, done: false })
      .select()
      .single();
    if (error) { console.error('추가 실패:', error); return; }
    items.push(data);
    render();
  }

  async function toggle(id) {
    const it = items.find(i => i.id === id);
    if (!it) return;
    const next = !it.done;
    it.done = next; // 낙관적 업데이트
    render();
    const { error } = await db.from(TABLE).update({ done: next }).eq('id', id);
    if (error) { console.error('상태 변경 실패:', error); it.done = !next; render(); }
  }

  async function remove(id) {
    const { error } = await db.from(TABLE).delete().eq('id', id);
    if (error) { console.error('삭제 실패:', error); return; }
    items = items.filter(i => i.id !== id);
    render();
  }

  async function clearDone() {
    const { error } = await db.from(TABLE).delete().eq('done', true);
    if (error) { console.error('완료 항목 비우기 실패:', error); return; }
    items = items.filter(i => !i.done);
    render();
  }

  function render() {
    listEl.innerHTML = '';
    if (items.length === 0) {
      emptyEl.style.display = 'block';
      footerEl.style.display = 'none';
      return;
    }
    emptyEl.style.display = 'none';
    footerEl.style.display = 'flex';

    items.forEach(it => {
      const li = document.createElement('li');
      if (it.done) li.classList.add('done');

      const check = document.createElement('div');
      check.className = 'check';
      check.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      check.onclick = () => toggle(it.id);

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = it.name;

      li.appendChild(check);
      li.appendChild(name);

      if (it.qty) {
        const qty = document.createElement('span');
        qty.className = 'qty';
        qty.textContent = it.qty;
        li.appendChild(qty);
      }

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.title = '삭제';
      del.onclick = () => remove(it.id);
      li.appendChild(del);

      listEl.appendChild(li);
    });

    const doneCount = items.filter(i => i.done).length;
    counterEl.textContent = `전체 ${items.length}개 · 완료 ${doneCount}개`;
  }

  addBtn.onclick = addItem;
  itemInput.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
  qtyInput.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
  clearBtn.onclick = clearDone;

  load();
  itemInput.focus();
</script>
</body>
</html>
